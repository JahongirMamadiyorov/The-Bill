<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- img-src needs the Render backend domain: menu-item photos are served
         from there (multer disk upload + express.static('/uploads'), see
         restaurant-app/backend/src/routes/menu.js + server.js), not from this
         app's own origin — without this, every real photo silently fails to
         load and falls back to nothing (broken-image icon), while items with
         no photo correctly show the placeholder instead. (There is no staff
         avatar/photo feature in this app — only menu_items has an image_url
         column, confirmed against schema.sql — don't assume one exists.)
         `app-photo:` is the local disk-cache scheme registered in main.js —
         see src/lib/localPhoto.js. -->
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: app-photo: https://the-bill-backend-pego.onrender.com;" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>The Bill POS</title>
    <!-- Plus Jakarta Sans is self-hosted now (see src/index.css) — no Google
         Fonts CDN dependency, no offline fallback needed, works identically
         online or off. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
